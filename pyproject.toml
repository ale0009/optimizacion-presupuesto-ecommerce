[project]
name = "optimizacion-presupuesto-ecommerce"
version = "0.1.0"
description = "Modelo ilustrativo de asignación de presupuesto para proyectos e-commerce en Colombia"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Mario Alejandro Puerta Alarcón" }]
dependencies = [
  "pulp>=2.9,<3.3",
  "pyyaml>=6,<7",
  "matplotlib>=3.8,<4",
]

[project.scripts]
ecommerce-opt = "optimizacion_ecommerce.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimizacion_ecommerce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
